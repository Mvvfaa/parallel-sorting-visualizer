<!DOCTYPE html>
<html>

<head>

    <title>
        Parallel Sorting Visualizer
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .serial-complexity-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
            border: 2px solid #4fc3f7;
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.25);
            color: #fff;
        }
        .serial-complexity-card .metric-value {
            color: #4fc3f7;
            text-shadow: 0 0 12px rgba(79, 195, 247, 0.6);
        }
        .serial-complexity-card .metric-label {
            color: #b0bec5;
        }

        .parallel-complexity-card {
            background: linear-gradient(135deg, #1b2a1b 0%, #1e3a1e 60%, #0a4a1a 100%);
            border: 2px solid #69f0ae;
            box-shadow: 0 4px 20px rgba(105, 240, 174, 0.25);
            color: #fff;
        }
        .parallel-complexity-card .metric-value {
            color: #69f0ae;
            text-shadow: 0 0 12px rgba(105, 240, 174, 0.6);
        }
        .parallel-complexity-card .metric-label {
            color: #b0bec5;
        }

        .threads-card {
            background: linear-gradient(135deg, #2a1a0e 0%, #3a2010 60%, #5a2d00 100%);
            border: 2px solid #ffb74d;
            box-shadow: 0 4px 20px rgba(255, 183, 77, 0.25);
            color: #fff;
        }
        .threads-card .metric-value {
            color: #ffb74d;
            text-shadow: 0 0 12px rgba(255, 183, 77, 0.6);
        }
        .threads-card .metric-label {
            color: #b0bec5;
        }
    </style>

</head>

<body>

    <h1>
        Parallel Sorting Visualizer
    </h1>

    <div class="controls">

        <button onclick="generateArray()">
            Generate Array
        </button>

        <button onclick="startSorting()">
            Start Sorting
        </button>

        <select id="algorithm">

            <option value="bubble">
                Bubble Sort
            </option>

            <option value="merge">
                Merge Sort
            </option>

            <option value="quick">
                Quick Sort
            </option>

            <option value="shell">
                Shell Sort
            </option>

        </select>

        <div class="size-control">

            <label for="sizeSlider">
                Size
            </label>

            <input
                type="range"
                min="10"
                max="200"
                value="30"
                id="sizeSlider"
            >

            <span id="sizeValue">30</span>

        </div>

        <div class="size-presets">

            <button type="button" onclick="setSize(30)">30</button>
            <button type="button" onclick="setSize(60)">60</button>
            <button type="button" onclick="setSize(100)">100</button>
            <button type="button" onclick="setSize(150)">150</button>
            <button type="button" onclick="setSize(200)">200</button>

        </div>

    </div>

    <div class="section">

        <h2>
            Original Array
        </h2>

        <div
            class="bars"
            id="originalBars"
        ></div>

    </div>

    <div class="container">

        <div class="section">

            <h2>
                Parallel Execution
            </h2>

            <div
                class="bars"
                id="serialBars"
            ></div>

            <p id="serialTime">
                Time: 0 ms
            </p>

        </div>

        <div class="section">

            <h2>
                Serial Execution
            </h2>

            <div
                class="bars"
                id="parallelBars"
            ></div>

            <p id="parallelTime">
                Time: 0 ms
            </p>

        </div>

    </div>

    <div class="key-metrics">

        <h2>
            Key Metrics
        </h2>

        <div class="metrics-grid">

            <div class="metric-card serial-complexity-card">
                <div class="metric-value" id="serialComplexity">O(n²)</div>
                <div class="metric-label">Serial Complexity</div>
            </div>

            <div class="metric-card parallel-complexity-card">
                <div class="metric-value" id="parallelComplexity">O(n²/p)</div>
                <div class="metric-label">Parallel Complexity</div>
            </div>

            <div class="metric-card threads-card">
                <div class="metric-value" id="threadsUsed">4</div>
                <div class="metric-label">Threads Used</div>
            </div>

        </div>

    </div>

    <div class="swap-section">

        <h2>
            Step-by-Step Array Visualization
        </h2>

        <div class="swap-legend">

            <div class="legend-item comparing">
                <span class="legend-box"></span>
                Comparing
            </div>

            <div class="legend-item swapping">
                <span class="legend-box"></span>
                Swapping
            </div>

            <div class="legend-item placing">
                <span class="legend-box"></span>
                Placing
            </div>

            <div class="legend-item sorted">
                <span class="legend-box"></span>
                Sorted
            </div>

        </div>

        <div class="swap-controls">

            <button type="button" onclick="generateDemoArray()">
                New Small Array
            </button>

            <button type="button" onclick="startSwapDemo()">
                Play Steps
            </button>

            <button type="button" onclick="pauseResumeDemo()" id="pauseBtn" style="display:none;">
                Pause
            </button>

            <button type="button" onclick="stepForward()" id="stepBtn" style="display:none;">
                Next Step
            </button>

            <p id="swapStatus">
                Status: Ready
            </p>

        </div>

        <div class="swap-boxes" id="swapBoxes"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
